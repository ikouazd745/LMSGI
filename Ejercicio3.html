<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informacion usuarios</title>
</head>
<body>
    <h1>Formulario de registro de usuarios</h1>
    <form action="#" method="POST">

        <!-- SECCIÓN: INFORMACIÓN PERSONAL -->
    <fieldset class="grupo-formulario">
            <legend>Información Personal</legend>
            
            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </p>

            <p>
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required>
            </p>

            <p>
                <label for="fecha-nacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fecha-nacimiento" name="fecha_nacimiento" required>
            </p>

            <p>
                <span>Género:</span>
                <input type="radio" id="genero-masculino" name="genero" value="Masculino" required>
                <label for="genero-masculino">Masculino</label>

                <input type="radio" id="genero-femenino" name="genero" value="Femenino">
                <label for="genero-femenino">Femenino</label>

                <input type="radio" id="genero-otro" name="genero" value="Otro">
                <label for="genero-otro">Otro</label>
            </p>
            <legend>Información de Contacto</legend>
            <p>
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" required>
            </p>

            <p>
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono" required>
            </p>
            <p>
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion" required>
            </p>

            <p>
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono" required>
            </p>
            <legend>Información de Cuenta</legend>
            <p>
                <label for="usuario">Nombre de Usuario:</label>
                <input type="text" id="usuario" name="usuario" required>
            </p>
            <p>
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" required> 
            </p>
            <p>     
                <label for="confirmar-contrasena">Confirmar Contraseña:</label>
                <input type="password" id="confirmar-contrasena" name="confirmar_contrasena" required>
            </p>
            <legend>Preferencias</legend>
            <p>       
                <label for ="Color">Color Favorito:</label>
                <input type="color" id="color" name="color">
                <select name="Color" id="Color">
                    <option value="Red">Rojo</option>
                    <option value="Blue">Azul</option>
                    <option value="Green">Verde</option>
                </select>
            </p>
            <p>
                <input type="checkbox" id="Terminos" name="Terminos" value="si">
                <label for="Terminos">Acepto los términos y condiciones</label>
            </p>
        </fieldset>
</body>
</html>
